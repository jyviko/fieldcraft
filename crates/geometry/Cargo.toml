[package]
name = "modelcraft-geometry"
description = "ModelCraft's geometry boundary: CAD import, measures and tessellation, implemented with SolidCraft's B-rep kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
modelcraft-model = { workspace = true }
solidcraft-geom = { workspace = true }
solidcraft-kernel = { workspace = true }
solidcraft-doc = { workspace = true }
solidcraft-io = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
solidcraft-engine = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Build designs from SolidCraft command scripts (`script_design`): the test corpus and tooling.
# Off by default; the library itself only opens designs.
scripts = ["dep:solidcraft-engine", "dep:serde_json"]
