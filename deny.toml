[advisories]
unmaintained = "all"
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# SolidCraft's kernel and its patched truck crates, pinned by rev in Cargo.toml.
# storytold/craft-libs: the Craft family's shared UI components (craft-ui), pinned by rev.
allow-git = ["https://github.com/bherbruck/solidcraft", "https://github.com/storytold/craft-libs"]

# What FieldCraft may ship: permissive licences only (no copyleft). A crate offering
# a choice (MIT OR LGPL) passes on its permissive option. THIRD-PARTY-LICENSES.txt is generated at
# release time (`cargo xtask licences`); this is the policy every pull request is held to.
[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
