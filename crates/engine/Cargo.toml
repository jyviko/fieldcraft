[package]
name = "fieldcraft-engine"
description = "FieldCraft's command engine: every user-visible action as a command with a JSON form"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fieldcraft-model = { workspace = true }
# Samples build their geometry from SolidCraft scripts (sample.rs).
fieldcraft-geometry = { workspace = true, features = ["scripts"] }
fieldcraft-mesh = { workspace = true }
fieldcraft-io = { workspace = true }
fieldcraft-decks = { workspace = true }
fieldcraft-solver = { workspace = true }
fieldcraft-explicit = { workspace = true }
fieldcraft-fem = { workspace = true }
fieldcraft-lbm = { workspace = true }
fieldcraft-parallel = { workspace = true }
fieldcraft-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
png = { workspace = true }
zip = { workspace = true }
