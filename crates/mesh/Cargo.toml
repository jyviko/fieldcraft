[package]
name = "fieldcraft-mesh"
description = "FieldCraft's meshing: robust predicates, surface preparation, tetrahedral and hexahedral meshing, quality metrics"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fieldcraft-model = { workspace = true }
fieldcraft-parallel = { workspace = true }
# Pure-Rust maths (a port of musl's libm) for sin, cos, log, exp, pow, hypot, acos: the same
# bits on every platform, where the system library's are not correctly rounded and differ (the
# plate's hex mesh differed between macOS and Linux, #438). atan2 and cbrt are crate::vec3's.
libm = "0.2"
thiserror = { workspace = true }

[dev-dependencies]
# Test oracles only (never linked into FieldCraft): exact rationals, and georust's port of
# Shewchuk's public-domain predicates.c as a differential reference.
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint", "std"] }
num-traits = "0.2"
robust = "1.2"
